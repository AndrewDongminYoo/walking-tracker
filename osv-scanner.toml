[[IgnoredVulns]]
id = "GHSA-3g3m-2fjr-6pw4"
reason = "glob@13.0.7 via jest@30.5.2 -> @jest/core@30.5.2 -> @jest/reporters, jest-config and jest-runtime@30.5.2, and glob@10.5.0 via jest -> @jest/transform -> babel-plugin-istanbul@8.0.0 -> test-exclude@7.0.2, have no compatible patch as of 2026-11-19: the advisory covers >= 9.0.0, <= 14.0.1 and the fix is glob 14.0.2. jest 30.5.2 is the newest jest and those three packages still require glob@^13.0.6, and 13.0.7 is the last glob 13.x release. babel-plugin-istanbul 8.0.0 (the latest dist-tag) through 8.0.2 (the newest published) still require test-exclude@^7.0.1, which requires glob@^10.4.1, and 10.5.0 is the last glob 10.x release; test-exclude 8.0.0, the newest release, requires glob@^13.0.6, so moving to it would not reach the fix either. Medium severity, AbortSignal cancellation bypass that allows filesystem traversal after a timeout. Both paths start at the jest devDependency, and no first-party source imports glob. Approved on 2026-11-05; facts re-checked on 2026-11-19. Re-evaluate when jest accepts glob 14 and babel-plugin-istanbul moves to a test-exclude release that does."

[[IgnoredVulns]]
id = "GHSA-g3hv-75wg-m249"
reason = "minimatch@10.2.6 via glob@13.0.7 (requested by @jest/reporters, jest-config and jest-runtime@30.5.2) and via babel-plugin-istanbul@8.0.0 -> test-exclude@7.0.2, and minimatch@9.0.9 via test-exclude@7.0.2 -> glob@10.5.0, have no compatible patch as of 2026-11-19: the advisory covers >= 7.0.0, < 11.0.1 and the fix is minimatch 11.0.1. jest 30.5.2 is the newest jest; glob 13.0.7 and test-exclude 8.0.0, the newest releases, still require minimatch@^10.2.2; babel-plugin-istanbul 8.0.0 requires test-exclude@^7.0.1; and 10.2.6, 9.0.9 and glob 10.5.0 are the last releases of their lines. The eslint path (eslint, @eslint/config-array and @typescript-eslint/typescript-estree) already resolves minimatch@11.0.9 in yarn.lock and is no longer covered by this entry. Medium severity, DoS through globparts. Reached only by the jest devDependency, not shipped app code, and no first-party source imports minimatch. First approved on 2026-11-05; scope narrowed to the jest path on 2026-11-19. Re-evaluate when glob and test-exclude accept minimatch 11 and jest moves to them."

[[IgnoredVulns]]
id = "GHSA-8474-xrp6-wh69"
reason = "activesupport@7.2.4 via the Gemfile and cocoapods-core@1.17.0 has no compatible patch as of 2026-11-19: the advisory covers < 8.0.5.2 and >= 8.1.0.beta1, < 8.1.4.1, with fixes only in 8.0.5.2 and 8.1.4.1, and 7.2.4 is the last 7.2 release. cocoapods-core 1.17.0, the newest release, requires activesupport >= 5.0, < 8. High severity, DoS through safe_constantize. No .rb file in cocoapods 1.17.0, cocoapods-core 1.17.0, xcodeproj 1.28.1, cocoapods-downloader 2.1, cocoapods-trunk 1.6.0 or cocoapods-plugins 1.0.0 calls constantize or safe_constantize (grep over vendor/bundle); inside activesupport 7.2.4 the only non-test callers (delegation.rb, rescuable.rb) pass constant names defined in code. Reached only by the CocoaPods tooling at pod install time, not shipped app code. Approved on 2026-11-19. Re-evaluate when cocoapods-core accepts activesupport 8."
