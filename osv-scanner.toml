reason = "braces@3.0.3 has no published patch as of 2026-10-22. Evidence: yarn why braces resolves the Jest transform/micromatch dependency; micromatch exposes brace expansion, so repository/test patterns must remain trusted. Approved on 2026-10-22 for this tooling-only use. Remove when a compatible patch is available or untrusted pattern inputs are introduced."

[[IgnoredVulns]]
id = "GHSA-hp3w-g68c-fv3c"
reason = "sprintf-js@1.0.3 has no published patch as of 2026-10-22. Evidence: yarn why sprintf-js resolves load-nyc-config -> js-yaml -> argparse; sprintf is used by argparse CLI help/error formatting. Loading YAML through require('js-yaml').load does not load argparse or sprintf-js, as checked with require.cache. Approved on 2026-10-22 for trusted tooling inputs. Remove when a compatible patch is available or untrusted format inputs are introduced."

[[IgnoredVulns]]
id = "GHSA-3g3m-2fjr-6pw4"
reason = "glob@13.0.6 via jest@30.5.2 -> @jest/core@30.5.2 -> @jest/reporters, jest-config and jest-runtime@30.5.2, and glob@10.5.0 via jest -> @jest/transform -> babel-plugin-istanbul@8.0.0 -> test-exclude@7.0.2, have no compatible patch as of 2026-11-05: the advisory covers >= 9.0.0, <= 14.0.1 and the fix is glob 14.0.2. jest 30.5.2 is the newest jest and those three packages still require glob@^13.0.6; babel-plugin-istanbul 8.0.2, its newest release, still requires test-exclude@^7.0.1, which requires glob@^10.4.1, and 10.5.0 is the last glob 10.x release. Medium severity, AbortSignal cancellation bypass that allows filesystem traversal after a timeout. Both paths start at the jest devDependency, and no first-party source imports glob. Approved on 2026-11-05. Re-evaluate when jest accepts glob 14 or babel-plugin-istanbul moves to a test-exclude release that does."

[[IgnoredVulns]]
id = "GHSA-g3hv-75wg-m249"
reason = "minimatch@10.2.6 via the eslint@10.13.0 devDependency (directly and through @eslint/config-array@0.23.5), @react-native/eslint-config@0.88.1 -> @typescript-eslint/parser@8.72.1 -> @typescript-eslint/typescript-estree@8.72.1, glob@13.0.6, and test-exclude@7.0.2, and minimatch@9.0.9 via test-exclude@7.0.2 -> glob@10.5.0, have no compatible patch as of 2026-11-05: the advisory covers >= 7.0.0, < 11.0.1 and the fix is minimatch 11.0.1. The newest eslint (10.14.0) requires minimatch@^10.2.6, @eslint/config-array 0.23.5 and @typescript-eslint/typescript-estree 8.72.1, both the newest releases, require ^10.2.4 and ^10.2.2, and 10.2.6 and 9.0.9 are the last releases of their lines. Medium severity, DoS through globparts. Reached only by lint and test tooling (eslint, jest), not shipped app code, and no first-party source imports minimatch. Approved on 2026-11-05. Re-evaluate when eslint, @eslint/config-array and typescript-estree accept minimatch 11 and the jest chain moves off glob 10 and 13."

[[IgnoredVulns]]
id = "GHSA-gcqx-w48m-w2h4"
reason = "deepmerge@4.3.1 via @react-native-community/cli@20.2.0 (also through @react-native-community/cli-config@20.2.0 and @react-native-community/cli-doctor@20.2.0) and via jest@30.5.2 -> @jest/core@30.5.2 -> jest-config@30.5.2 has no patched release as of 2026-11-05: the advisory lists no first_patched_version for >= 4.2.0, <= 4.3.1, and 4.3.1 is the latest published version (npm view deepmerge version), itself affected. Low severity, prototype poisoning through mergeObject(). Every parent is a devDependency and no first-party source imports deepmerge; whether those tools call mergeObject() with untrusted input was not verified. Approved on 2026-11-05. Re-evaluate when deepmerge publishes a patched release or @react-native-community/cli and jest-config drop it."
