# concurrent-ruby is a transitive dependency of activesupport, pulled in only by
# the CocoaPods build toolchain (Gemfile / Gemfile.lock) — it is never shipped in
# the app bundle. All three advisories below are patched in concurrent-ruby 1.3.7,
# but the Gemfile pins `concurrent-ruby < 1.3.4` to avoid a known CocoaPods build
# regression. Relaxing that pin requires verifying `bundle exec pod install` on
# iOS, so these stay ignored until the pin can be lifted safely.
# Re-evaluate: 2026-07-11.

[[IgnoredVulns]]
id = "GHSA-h8w8-99g7-qmvj"
reason = "concurrent-ruby AtomicReference#update livelock; patched in 1.3.7 but blocked by Gemfile pin `concurrent-ruby < 1.3.4`. Dev-only CocoaPods tooling, not in app bundle. As of 2026-07-11."

