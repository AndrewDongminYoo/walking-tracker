version: 0.1
cli:
  version: 1.29.0
plugins:
  sources:
    - id: trunk
      ref: v1.11.0
      uri: https://github.com/trunk-io/plugins
lint:
  definitions:
    - name: gitleaks
      commands:
        - name: lint
          # Explicit config is required when Trunk scans a copied target file.
          run: gitleaks detect --no-git --source=${target} --config=${workspace}/.gitleaks.toml --redact --exit-code=101 -f sarif -r "${tmpfile}"
    - name: pinact
      commands:
        - name: upgrade
          enabled: true
  disabled:
    - dotenv-linter
    - grype
    - shellcheck
    - shfmt
  ignore:
    - linters: [osv-scanner]
      paths: ['**/Podfile.lock']
  enabled:
    - actionlint@1.7.12
    - checkov@3.4.3
    - eslint@10.14.0
    - git-diff-check
    - gitleaks@8.30.1
    - ktlint@1.8.0
    - markdownlint@0.50.0
    - osv-scanner@2.7.0
    - oxipng@10.2.1
    - pinact@4.1.1!
    - prettier@3.9.10
    - swiftlint@0.65.1
    - taplo@0.10.0
    - trivy@0.76.2
    - trufflehog@3.99.8
    - yamllint@1.38.0
runtimes:
  enabled:
    - java@13.0.11
    - go@1.21.0
    - node@22.16.0
    - python@3.14.4
actions:
  enabled:
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
    - trunk-upgrade-available
